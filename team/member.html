<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Profile of a member of the H2RES research team, with a selected bibliography of publications.">
  <link rel="canonical" href="https://h2res.org/team/member.html">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1417" media="(prefers-color-scheme: dark)">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="H2RES">
  <meta property="og:title" content="H2RES Team Member">
  <meta property="og:description" content="Profile of a member of the H2RES research team, with a selected bibliography of publications.">
  <meta property="og:url" content="https://h2res.org/team/member.html">
  <meta property="og:image" content="https://h2res.org/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="H2RES Team Member">
  <meta name="twitter:description" content="Profile of a member of the H2RES research team, with a selected bibliography of publications.">
  <meta name="twitter:image" content="https://h2res.org/assets/og-image.png">
  <title>H2RES Team Member</title>
  <link rel="stylesheet" href="../assets/css/site-shell.css">
  <link rel="stylesheet" href="../assets/css/team-member.css">
</head>
<body class="h2res-shell team-member-page" data-shell-root="../" data-shell-active="team" data-shell-model-href="../model/index.html" data-shell-model-resources-href="../model/index.html#model-resources">
  <div data-site-shell-header></div>

  <main class="page-shell">
    <div class="container">
      <div class="crumb"><a href="../index.html#team">&larr; Back to Team</a></div>

      <section class="profile-card">
        <img class="profile-photo" id="memberPhoto" alt="Team member photo">
        <div>
          <h1 class="member-name" id="memberName">Team Member</h1>
          <p class="member-role" id="memberRole"></p>
          <p class="member-org" id="memberOrg"></p>
          <p class="member-bio" id="memberBio"></p>
          <div class="topics" id="topicsBox"></div>
        </div>
      </section>

      <section class="pub-section">
        <h2 class="pub-title">Selected Bibliography</h2>
        <div class="member-pub-tabs" id="memberPubTabs"></div>
        <div id="pubRoot">
          <div class="pub-status">Loading records...</div>
        </div>
      </section>
    </div>
  </main>

  <div data-site-shell-footer></div>

  <script src="../assets/js/bibtex-utils.js"></script>
  <script src="../assets/js/site-config.js"></script>
  <script src="../assets/js/team-data.js"></script>
  <script>
    const PEOPLE = window.H2RES_TEAM_DATA || {};

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    const { normalizeBibValue, parseBibTeX } = window.H2resBibUtils;

    function foldText(value) {
      return normalizeBibValue(value)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function splitBibAuthors(authorValue) {
      return normalizeBibValue(authorValue)
        .split(/\s+and\s+/i)
        .map(part => part.trim())
        .filter(Boolean);
    }

    function buildAuthorMatchKeys(authorName) {
      const keys = new Set();
      const clean = normalizeBibValue(authorName);
      const folded = foldText(clean);
      if (!folded) {
        return keys;
      }
      keys.add(folded);

      if (clean.includes(",")) {
        const commaParts = clean
          .split(",")
          .map(part => foldText(part))
          .filter(Boolean);
        if (commaParts.length >= 2) {
          const family = commaParts[0];
          const given = commaParts.slice(1).join(" ");
          const reordered = `${given} ${family}`.replace(/\s+/g, " ").trim();
          if (reordered) {
            keys.add(reordered);
          }
        }
      }

      Array.from(keys).forEach(key => {
        const tokens = key.split(" ").filter(Boolean);
        if (tokens.length >= 2) {
          keys.add(`${tokens[0]} ${tokens[tokens.length - 1]}`);
        }
      });

      return keys;
    }

    function formatAuthors(authorValue) {
      const authors = (authorValue || "")
        .split(/\s+and\s+/i)
        .map(part => normalizeBibValue(part))
        .filter(Boolean);

      if (authors.length === 0) {
        return "";
      }
      if (authors.length > 4) {
        const first = authors[0];
        return `${first} et al.`;
      }
      return authors.join(", ");
    }

    function typeLabel(entryType) {
      const labels = {
        article: "Journal Article",
        inproceedings: "Conference Paper",
        inbook: "Book Chapter",
        incollection: "Book Chapter",
        mastersthesis: "Master Thesis",
        phdthesis: "PhD Thesis",
        techreport: "Technical Report"
      };
      return labels[entryType] || "Publication";
    }

    function categoryLabel(category) {
      const labels = {
        articles: "Articles",
        conference: "Conferences",
        report: "Reports",
        thesis: "Thesis",
        project: "Projects",
        database: "Databases"
      };
      return labels[category] || "Other";
    }

    function entryCategory(entry) {
      const normalizedType = (entry.entryType || "").toLowerCase();
      const fields = entry.fields || {};
      const context = [
        fields.title,
        fields.keywords,
        fields.note,
        fields.journal,
        fields.booktitle,
        fields.howpublished
      ].join(" ").toLowerCase();

      if (normalizedType === "article") {
        return "articles";
      }
      if (normalizedType === "inproceedings") {
        return "conference";
      }
      if (normalizedType === "mastersthesis" || normalizedType === "phdthesis" || normalizedType === "thesis") {
        return "thesis";
      }
      if (
        normalizedType === "dataset" ||
        normalizedType === "data" ||
        normalizedType === "software" ||
        /dataset|data set|database|zenodo|figshare|kaggle/.test(context)
      ) {
        return "database";
      }
      if (
        normalizedType === "techreport" ||
        normalizedType === "report" ||
        normalizedType === "manual" ||
        normalizedType === "inbook" ||
        normalizedType === "incollection" ||
        normalizedType === "book" ||
        /deliverable/.test(context)
      ) {
        return "report";
      }

      const normalizedHowPublished = normalizeBibValue(fields.howpublished || "").toLowerCase();
      if (normalizedType === "misc" && normalizedHowPublished === "research project") {
        return "project";
      }

      return "report";
    }

    function buildLinks(entry) {
      const links = [];
      const doiRaw = (entry.fields.doi || "").replace(/^doi:\s*/i, "").trim();
      const doiUrl = doiRaw.startsWith("http") ? doiRaw : (doiRaw ? `https://doi.org/${doiRaw}` : "");
      const url = entry.fields.url || "";

      if (doiUrl) {
        links.push(`<a href="${escapeHtml(doiUrl)}" target="_blank" rel="noopener noreferrer">DOI &#8599;</a>`);
      }
      if (url) {
        links.push(`<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">URL &#8599;</a>`);
      }
      links.push(`<button type="button" class="bibtex-copy" data-key="${escapeHtml(entry.citationKey)}">BibTeX</button>`);
      return links.join("");
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const helper = document.createElement("textarea");
      helper.value = text;
      helper.setAttribute("readonly", "");
      helper.style.position = "fixed";
      helper.style.left = "-9999px";
      document.body.appendChild(helper);
      helper.select();
      document.execCommand("copy");
      document.body.removeChild(helper);
    }

    function bindBibtexButtons(entries) {
      document.querySelectorAll(".bibtex-copy").forEach(button => {
        button.addEventListener("click", async () => {
          const key = button.getAttribute("data-key");
          const entry = entries.find(item => item.citationKey === key);
          if (!entry) {
            return;
          }
          const previous = button.textContent;
          try {
            await copyText(entry.bibtex);
            button.textContent = "Copied";
          } catch (error) {
            button.textContent = "Copy failed";
          }
          window.setTimeout(() => {
            button.textContent = previous;
          }, 1200);
        });
      });
    }

    function detailsIdFromKey(citationKey) {
      return `pub-details-${String(citationKey || "").replace(/[^a-zA-Z0-9_-]/g, "-")}`;
    }

    function buildPublicationDetails(entry) {
      const abstract = normalizeBibValue(entry.fields.abstract || "");
      const keywords = normalizeBibValue(entry.fields.keywords || "");
      const detailParts = [];

      if (abstract) {
        detailParts.push(`<div class="pub-details-row"><span class="pub-details-label">Abstract:</span> ${escapeHtml(abstract)}</div>`);
      }
      if (keywords) {
        detailParts.push(`<div class="pub-details-row"><span class="pub-details-label">Keywords:</span> ${escapeHtml(keywords)}</div>`);
      }
      if (detailParts.length === 0) {
        return "";
      }

      const detailsId = detailsIdFromKey(entry.citationKey);
      return `<div class="pub-details" id="${escapeHtml(detailsId)}" hidden>${detailParts.join("")}</div>`;
    }

    function buildPublicationItem(entry) {
      const title = entry.fields.title || entry.citationKey || "Untitled publication";
      const source = entry.fields.journal || entry.fields.booktitle || entry.fields.school || entry.fields.publisher || entry.fields.institution || "Unknown source";
      const year = entry.fields.year || "n.d.";
      const authors = formatAuthors(entry.fields.author);
      const meta = `${typeLabel(entry.entryType)} - ${source}, ${year}${authors ? ` - ${authors}` : ""}`;
      const detailsHtml = buildPublicationDetails(entry);
      const hasDetails = detailsHtml ? "true" : "false";
      const detailsId = detailsHtml ? detailsIdFromKey(entry.citationKey) : "";
      const interactiveAttrs = detailsHtml
        ? ` role="button" tabindex="0" aria-expanded="false" aria-controls="${escapeHtml(detailsId)}"`
        : "";

      return `
        <li class="pub-item" data-has-details="${hasDetails}" data-details-id="${escapeHtml(detailsId)}"${interactiveAttrs}>
          <h4>${escapeHtml(title)}</h4>
          <p class="pub-meta">${escapeHtml(meta)}</p>
          <div class="pub-links">${buildLinks(entry)}</div>
          ${detailsHtml}
        </li>
      `;
    }

    function bindPublicationItemToggleActions() {
      const cards = Array.from(document.querySelectorAll('.pub-item[data-has-details="true"]'));

      function setExpanded(card, expanded) {
        const detailsId = card.getAttribute("data-details-id");
        const details = detailsId ? document.getElementById(detailsId) : null;
        if (!details) {
          return;
        }
        if (expanded) {
          card.classList.add("expanded");
          card.setAttribute("aria-expanded", "true");
          details.removeAttribute("hidden");
        } else {
          card.classList.remove("expanded");
          card.setAttribute("aria-expanded", "false");
          details.setAttribute("hidden", "");
        }
      }

      function collapseOthers(activeCard) {
        cards.forEach(card => {
          if (card !== activeCard) {
            setExpanded(card, false);
          }
        });
      }

      cards.forEach(card => {
        card.addEventListener("click", event => {
          if (event.target.closest(".pub-links")) {
            return;
          }
          const isExpanded = card.getAttribute("aria-expanded") === "true";
          collapseOthers(card);
          setExpanded(card, !isExpanded);
        });

        card.addEventListener("keydown", event => {
          if (event.key !== "Enter" && event.key !== " ") {
            return;
          }
          event.preventDefault();
          const isExpanded = card.getAttribute("aria-expanded") === "true";
          collapseOthers(card);
          setExpanded(card, !isExpanded);
        });
      });
    }

    function fillProfile(person) {
      document.title = `${person.name} - H2RES Team`;
      document.getElementById("memberName").textContent = person.name;
      document.getElementById("memberRole").textContent = person.role;
      document.getElementById("memberOrg").textContent = person.institution;
      document.getElementById("memberBio").textContent = person.bio;
      const photo = document.getElementById("memberPhoto");
      const profileCard = document.querySelector(".profile-card");
      const hasPhoto = Boolean((person.photo || "").trim());
      if (hasPhoto) {
        photo.src = person.photo;
        photo.alt = `${person.name} photo`;
        photo.classList.remove("is-hidden");
        photo.removeAttribute("hidden");
        if (profileCard) {
          profileCard.classList.remove("no-photo");
        }
      } else {
        photo.removeAttribute("src");
        photo.alt = "";
        photo.classList.add("is-hidden");
        photo.setAttribute("hidden", "");
        if (profileCard) {
          profileCard.classList.add("no-photo");
        }
      }

      const topicsBox = document.getElementById("topicsBox");
      topicsBox.innerHTML = person.topics
        .map(topic => `<span class="topic-chip">${escapeHtml(topic)}</span>`)
        .join("");
    }

    function matchesPerson(entry, person) {
      const authors = splitBibAuthors(entry.fields.author || "");
      if (authors.length === 0) {
        return false;
      }

      const aliasKeys = (person.aliases || [])
        .map(alias => foldText(alias))
        .filter(alias => alias.split(" ").length >= 2);
      if (aliasKeys.length === 0) {
        return false;
      }

      return authors.some(author => {
        const authorKeys = buildAuthorMatchKeys(author);
        return aliasKeys.some(alias => authorKeys.has(alias));
      });
    }

    function renderPublications(entries, person) {
      const root = document.getElementById("pubRoot");
      const matched = entries
        .filter(entry => matchesPerson(entry, person))
        .sort((a, b) => {
          if (b.sortYear !== a.sortYear) {
            return b.sortYear - a.sortYear;
          }
          return a.citationKey.localeCompare(b.citationKey);
        });
      if (matched.length === 0) {
        root.innerHTML = '<div class="empty-box">No matching publications were found for this member in h2res_research_outputs.bib yet.</div>';
        return;
      }
      root.innerHTML = `
        <ul class="pub-list">
          ${matched.map(buildPublicationItem).join("")}
        </ul>
      `;
      bindBibtexButtons(matched);
      bindPublicationItemToggleActions();
    }

    function renderPublicationsWithTabs(entries, person) {
      const root = document.getElementById("pubRoot");
      const tabsRoot = document.getElementById("memberPubTabs");
      const matched = entries
        .filter(entry => matchesPerson(entry, person))
        .sort((a, b) => {
          if (b.sortYear !== a.sortYear) {
            return b.sortYear - a.sortYear;
          }
          return a.citationKey.localeCompare(b.citationKey);
        });

      if (matched.length === 0) {
        tabsRoot.innerHTML = "";
        root.innerHTML = '<div class="empty-box">No matching publications were found for this member in h2res_research_outputs.bib yet.</div>';
        return;
      }

      const categoryOrder = ["articles", "conference", "report", "thesis", "project", "database"];
      const grouped = {
        articles: [],
        conference: [],
        report: [],
        thesis: [],
        project: [],
        database: []
      };

      matched.forEach(entry => {
        const category = entryCategory(entry);
        if (!grouped[category]) {
          grouped[category] = [];
        }
        grouped[category].push(entry);
      });

      const visibleCategories = categoryOrder.filter(category => (grouped[category] || []).length > 0);
      if (visibleCategories.length === 0) {
        tabsRoot.innerHTML = "";
        root.innerHTML = '<div class="empty-box">No categorized publications were found for this member.</div>';
        return;
      }

      function renderCategory(category) {
        const selectedEntries = grouped[category] || [];
        root.innerHTML = `
          <ul class="pub-list">
            ${selectedEntries.map(buildPublicationItem).join("")}
          </ul>
        `;
        bindBibtexButtons(selectedEntries);
        bindPublicationItemToggleActions();
      }
      tabsRoot.innerHTML = visibleCategories
        .map((category, index) => {
          const count = grouped[category].length;
          const activeClass = index === 0 ? " active" : "";
          return `<button type="button" class="member-pub-tab${activeClass}" data-category="${escapeHtml(category)}">${escapeHtml(categoryLabel(category))} (${count})</button>`;
        })
        .join("");

      const tabButtons = Array.from(tabsRoot.querySelectorAll(".member-pub-tab"));
      tabButtons.forEach(button => {
        button.addEventListener("click", () => {
          const category = button.getAttribute("data-category");
          tabButtons.forEach(btn => btn.classList.remove("active"));
          button.classList.add("active");
          renderCategory(category);
        });
      });

      renderCategory(visibleCategories[0]);
    }

    async function bootstrap() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const person = PEOPLE[id];

      if (!person || person.hidden) {
        document.getElementById("memberName").textContent = "Member not found";
        document.getElementById("memberRole").textContent = "";
        document.getElementById("memberOrg").textContent = "";
        document.getElementById("memberBio").textContent = "Use the Team page and open a valid member profile.";
        document.getElementById("pubRoot").innerHTML = '<div class="empty-box">No profile loaded.</div>';
        return;
      }

      fillProfile(person);

      try {
        const response = await fetch("../h2res_research_outputs.bib", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const text = await response.text();
        const entries = parseBibTeX(text).map(entry => ({
          ...entry,
          sortYear: Number.parseInt(entry.fields.year, 10) || 0
        }));
        renderPublicationsWithTabs(entries, person);
      } catch (error) {
        document.getElementById("pubRoot").innerHTML = '<div class="pub-status">Could not load h2res_research_outputs.bib for this profile.</div>';
      }
    }
    bootstrap();
  </script>
  <script src="../assets/js/site-shell.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H2RES Team Member</title>
  <style>
    :root[data-theme="dark"] {
      --bg-dark: #0a0a0f;
      --bg-darker: #050508;
      --bg-card: #111118;
      --bg-card-hover: #1a1a24;
      --text-primary: #ffffff;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent-teal: #14b8a6;
      --accent-green: #10b981;
      --border-color: #1f2937;
      --border-hover: #374151;
    }

    :root[data-theme="light"] {
      --bg-dark: #ffffff;
      --bg-darker: #f9fafb;
      --bg-card: #ffffff;
      --bg-card-hover: #f3f4f6;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --accent-teal: #0d9488;
      --accent-green: #059669;
      --border-color: #e5e7eb;
      --border-hover: #d1d5db;
    }

    :root {
      --max-width: 1040px;
      --radius: 12px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-darker);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    .topbar {
      padding: 22px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .site-logo {
      display: inline-flex;
      align-items: center;
      gap: 0;
      text-decoration: none;
    }

    .site-logo-image {
      height: 36px;
      width: auto;
      display: block;
    }

    .back-link {
      color: var(--accent-teal);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .theme-btn {
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-secondary);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      cursor: pointer;
    }

    .theme-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .profile-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    .profile-photo {
      width: 180px;
      height: 180px;
      border-radius: 18px;
      object-fit: cover;
      border: 1px solid var(--border-color);
      background: var(--bg-card-hover);
    }

    .member-name {
      font-size: 32px;
      line-height: 1.2;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    .member-role {
      color: var(--accent-teal);
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .member-org {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 14px;
    }

    .member-bio {
      color: var(--text-secondary);
      font-size: 15px;
      margin-bottom: 14px;
    }

    .topics {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .topic-chip {
      border: 1px solid var(--border-color);
      background: var(--bg-card-hover);
      color: var(--text-secondary);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
    }

    .pub-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px;
      margin-bottom: 28px;
    }

    .pub-title {
      font-size: 22px;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .pub-subtitle {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 16px;
    }

    .pub-status {
      border: 1px dashed var(--border-color);
      border-radius: 10px;
      padding: 14px;
      font-size: 14px;
      color: var(--text-secondary);
      background: var(--bg-card-hover);
    }

    .member-pub-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .member-pub-tab {
      border: 1px solid var(--border-color);
      background: var(--bg-card-hover);
      color: var(--text-secondary);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .member-pub-tab:hover {
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .member-pub-tab.active {
      background: var(--accent-teal);
      color: #ffffff;
      border-color: var(--accent-teal);
    }

    .pub-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .pub-item {
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 16px;
      background: var(--bg-card);
      transition: all 0.2s ease;
      cursor: default;
    }

    .pub-item[data-has-details="true"] {
      cursor: pointer;
    }

    .pub-item:hover {
      border-color: var(--border-hover);
      background: var(--bg-card-hover);
    }

    .pub-item.expanded {
      border-color: var(--accent-teal);
      background: var(--bg-card-hover);
    }

    .pub-item h4 {
      font-size: 15px;
      line-height: 1.4;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .pub-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .pub-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pub-links a,
    .pub-links button {
      color: var(--accent-teal);
      font-size: 12px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      text-decoration: none;
    }

    .pub-links a:hover,
    .pub-links button:hover {
      text-decoration: underline;
    }

    .pub-details {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .pub-details[hidden] {
      display: none;
    }

    .pub-details-row + .pub-details-row {
      margin-top: 8px;
    }

    .pub-details-label {
      font-weight: 600;
      color: var(--text-primary);
    }

    .empty-box {
      border: 1px dashed var(--border-color);
      border-radius: 10px;
      padding: 14px;
      color: var(--text-secondary);
      background: var(--bg-card-hover);
      font-size: 14px;
    }

    @media (max-width: 840px) {
      .topbar {
        flex-wrap: wrap;
      }

      .profile-card {
        grid-template-columns: 1fr;
      }

      .profile-photo {
        width: 140px;
        height: 140px;
      }

      .member-name {
        font-size: 26px;
      }
    }
  </style>
</head>

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function normalizeBibValue(value) {
      return (value || "")
        .replace(/\r\n?/g, "\n")
        .replace(/\\&/g, "&")
        .replace(/\\%/g, "%")
        .replace(/\\_/g, "_")
        .replace(/[{}]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function foldText(value) {
      return normalizeBibValue(value)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function findTopLevelComma(text) {
      let depth = 0;
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const prev = i > 0 ? text[i - 1] : "";
        if (char === "\"" && prev !== "\\") {
          inQuotes = !inQuotes;
          continue;
        }
        if (inQuotes) {
          continue;
        }
        if (char === "{") {
          depth++;
        } else if (char === "}") {
          depth = Math.max(0, depth - 1);
        } else if (char === "," && depth === 0) {
          return i;
        }
      }
      return -1;
    }

    function readBibValue(text, startIndex) {
      let index = startIndex;
      while (index < text.length && /\s/.test(text[index])) {
        index++;
      }

      const first = text[index];
      if (!first) {
        return { value: "", nextIndex: index };
      }

      if (first === "{") {
        let depth = 1;
        let i = index + 1;
        let inQuotes = false;
        while (i < text.length && depth > 0) {
          const char = text[i];
          const prev = i > 0 ? text[i - 1] : "";
          if (char === "\"" && prev !== "\\") {
            inQuotes = !inQuotes;
          }
          if (!inQuotes) {
            if (char === "{") {
              depth++;
            } else if (char === "}") {
              depth--;
            }
          }
          i++;
        }
        return {
          value: text.slice(index + 1, Math.max(index + 1, i - 1)),
          nextIndex: i
        };
      }

      if (first === "\"") {
        let i = index + 1;
        while (i < text.length) {
          if (text[i] === "\"" && text[i - 1] !== "\\") {
            break;
          }
          i++;
        }
        return {
          value: text.slice(index + 1, i),
          nextIndex: Math.min(i + 1, text.length)
        };
      }

      let i = index;
      while (i < text.length && text[i] !== ",") {
        i++;
      }
      return {
        value: text.slice(index, i).trim(),
        nextIndex: i
      };
    }

    function parseBibFields(fieldsText) {
      const fields = {};
      let index = 0;

      while (index < fieldsText.length) {
        while (index < fieldsText.length && /[\s,]/.test(fieldsText[index])) {
          index++;
        }
        if (index >= fieldsText.length) {
          break;
        }

        const fieldStart = index;
        while (index < fieldsText.length && /[a-zA-Z0-9_-]/.test(fieldsText[index])) {
          index++;
        }
        const fieldName = fieldsText.slice(fieldStart, index).toLowerCase();
        while (index < fieldsText.length && /\s/.test(fieldsText[index])) {
          index++;
        }
        if (fieldsText[index] !== "=") {
          const nextComma = findTopLevelComma(fieldsText.slice(index));
          if (nextComma === -1) {
            break;
          }
          index += nextComma + 1;
          continue;
        }
        index++;

        const parsedValue = readBibValue(fieldsText, index);
        fields[fieldName] = normalizeBibValue(parsedValue.value);
        index = parsedValue.nextIndex;
      }

      return fields;
    }

    function parseBibTeX(text) {
      const cleanText = (text || "")
        .replace(/\r\n?/g, "\n")
        .replace(/^\s*%.*$/gm, "");

      const entries = [];
      let index = 0;

      while (index < cleanText.length) {
        const atIndex = cleanText.indexOf("@", index);
        if (atIndex === -1) {
          break;
        }

        const headerMatch = cleanText.slice(atIndex + 1).match(/^([A-Za-z]+)\s*([{(])/);
        if (!headerMatch) {
          index = atIndex + 1;
          continue;
        }

        const entryType = headerMatch[1].toLowerCase();
        const openChar = headerMatch[2];
        const closeChar = openChar === "{" ? "}" : ")";
        const openIndex = atIndex + 1 + headerMatch[0].length - 1;

        let i = openIndex + 1;
        let depth = 1;
        let inQuotes = false;

        while (i < cleanText.length && depth > 0) {
          const char = cleanText[i];
          const prev = i > 0 ? cleanText[i - 1] : "";
          if (char === "\"" && prev !== "\\") {
            inQuotes = !inQuotes;
          } else if (!inQuotes) {
            if (char === openChar) {
              depth++;
            } else if (char === closeChar) {
              depth--;
            }
          }
          i++;
        }

        if (depth !== 0) {
          break;
        }

        const rawBody = cleanText.slice(openIndex + 1, i - 1).trim();
        const commaIndex = findTopLevelComma(rawBody);
        if (commaIndex === -1) {
          index = i;
          continue;
        }

        const citationKey = rawBody.slice(0, commaIndex).trim();
        const fieldsText = rawBody.slice(commaIndex + 1).trim();
        const fields = parseBibFields(fieldsText);

        entries.push({
          entryType,
          citationKey,
          fields,
          bibtex: cleanText.slice(atIndex, i).trim(),
          sortYear: Number.parseInt(fields.year, 10) || 0
        });

        index = i;
      }

      return entries;
    }

    function formatAuthors(authorValue) {
      const authors = (authorValue || "")
        .split(/\s+and\s+/i)
        .map(part => normalizeBibValue(part))
        .filter(Boolean);

      if (authors.length === 0) {
        return "";
      }
      if (authors.length > 4) {
        const first = authors[0];
        return `${first} et al.`;
      }
      return authors.join(", ");
    }

    function typeLabel(entryType) {
      const labels = {
        article: "Journal Article",
        inproceedings: "Conference Paper",
        inbook: "Book Chapter",
        incollection: "Book Chapter",
        mastersthesis: "Master Thesis",
        phdthesis: "PhD Thesis",
        techreport: "Technical Report"
      };
      return labels[entryType] || "Publication";
    }

    function categoryLabel(category) {
      const labels = {
        articles: "Articles",
        conference: "Conferences",
        report: "Reports",
        thesis: "Thesis",
        project: "Projects",
        database: "Databases"
      };
      return labels[category] || "Other";
    }

    function entryCategory(entry) {
      const normalizedType = (entry.entryType || "").toLowerCase();
      const fields = entry.fields || {};
      const context = [
        fields.title,
        fields.keywords,
        fields.note,
        fields.journal,
        fields.booktitle,
        fields.howpublished
      ].join(" ").toLowerCase();

      if (normalizedType === "article") {
        return "articles";
      }
      if (normalizedType === "inproceedings") {
        return "conference";
      }
      if (normalizedType === "mastersthesis" || normalizedType === "phdthesis" || normalizedType === "thesis") {
        return "thesis";
      }
      if (
        normalizedType === "dataset" ||
        normalizedType === "data" ||
        normalizedType === "software" ||
        /dataset|data set|database|zenodo|figshare|kaggle/.test(context)
      ) {
        return "database";
      }
      if (
        normalizedType === "techreport" ||
        normalizedType === "report" ||
        normalizedType === "manual" ||
        normalizedType === "inbook" ||
        normalizedType === "incollection" ||
        normalizedType === "book" ||
        /deliverable/.test(context)
      ) {
        return "report";
      }
      if (
        normalizedType === "misc" ||
        normalizedType === "unpublished" ||
        /project|horizon|grant|work package|wp\d+/.test(context)
      ) {
        return "project";
      }

      return "report";
    }

    function buildLinks(entry) {
      const links = [];
      const doiRaw = (entry.fields.doi || "").replace(/^doi:\s*/i, "").trim();
      const doiUrl = doiRaw.startsWith("http") ? doiRaw : (doiRaw ? `https://doi.org/${doiRaw}` : "");
      const url = entry.fields.url || "";

      if (doiUrl) {
        links.push(`<a href="${escapeHtml(doiUrl)}" target="_blank" rel="noopener noreferrer">DOI ↗</a>`);
      }
      if (url) {
        links.push(`<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">URL ↗</a>`);
      }
      links.push(`<button type="button" class="bibtex-copy" data-key="${escapeHtml(entry.citationKey)}">BibTeX</button>`);
      return links.join("");
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const helper = document.createElement("textarea");
      helper.value = text;
      helper.setAttribute("readonly", "");
      helper.style.position = "fixed";
      helper.style.left = "-9999px";
      document.body.appendChild(helper);
      helper.select();
      document.execCommand("copy");
      document.body.removeChild(helper);
    }

    function bindBibtexButtons(entries) {
      document.querySelectorAll(".bibtex-copy").forEach(button => {
        button.addEventListener("click", async () => {
          const key = button.getAttribute("data-key");
          const entry = entries.find(item => item.citationKey === key);
          if (!entry) {
            return;
          }
          const previous = button.textContent;
          try {
            await copyText(entry.bibtex);
            button.textContent = "Copied";
          } catch (error) {
            button.textContent = "Copy failed";
          }
          window.setTimeout(() => {
            button.textContent = previous;
          }, 1200);
        });
      });
    }

    function detailsIdFromKey(citationKey) {
      return `pub-details-${String(citationKey || "").replace(/[^a-zA-Z0-9_-]/g, "-")}`;
    }

    function buildPublicationDetails(entry) {
      const abstract = normalizeBibValue(entry.fields.abstract || "");
      const keywords = normalizeBibValue(entry.fields.keywords || "");
      const detailParts = [];

      if (abstract) {
        detailParts.push(`<div class="pub-details-row"><span class="pub-details-label">Abstract:</span> ${escapeHtml(abstract)}</div>`);
      }
      if (keywords) {
        detailParts.push(`<div class="pub-details-row"><span class="pub-details-label">Keywords:</span> ${escapeHtml(keywords)}</div>`);
      }
      if (detailParts.length === 0) {
        return "";
      }

      const detailsId = detailsIdFromKey(entry.citationKey);
      return `<div class="pub-details" id="${escapeHtml(detailsId)}" hidden>${detailParts.join("")}</div>`;
    }

    function buildPublicationItem(entry) {
      const title = entry.fields.title || entry.citationKey || "Untitled publication";
      const source = entry.fields.journal || entry.fields.booktitle || entry.fields.school || entry.fields.publisher || entry.fields.institution || "Unknown source";
      const year = entry.fields.year || "n.d.";
      const authors = formatAuthors(entry.fields.author);
      const meta = `${typeLabel(entry.entryType)} - ${source}, ${year}${authors ? ` - ${authors}` : ""}`;
      const detailsHtml = buildPublicationDetails(entry);
      const hasDetails = detailsHtml ? "true" : "false";
      const detailsId = detailsHtml ? detailsIdFromKey(entry.citationKey) : "";
      const interactiveAttrs = detailsHtml
        ? ` role="button" tabindex="0" aria-expanded="false" aria-controls="${escapeHtml(detailsId)}"`
        : "";

      return `
        <li class="pub-item" data-has-details="${hasDetails}" data-details-id="${escapeHtml(detailsId)}"${interactiveAttrs}>
          <h4>${escapeHtml(title)}</h4>
          <p class="pub-meta">${escapeHtml(meta)}</p>
          <div class="pub-links">${buildLinks(entry)}</div>
          ${detailsHtml}
        </li>
      `;
    }

    function bindPublicationItemToggleActions() {
      const cards = Array.from(document.querySelectorAll('.pub-item[data-has-details="true"]'));

      function setExpanded(card, expanded) {
        const detailsId = card.getAttribute("data-details-id");
        const details = detailsId ? document.getElementById(detailsId) : null;
        if (!details) {
          return;
        }
        if (expanded) {
          card.classList.add("expanded");
          card.setAttribute("aria-expanded", "true");
          details.removeAttribute("hidden");
        } else {
          card.classList.remove("expanded");
          card.setAttribute("aria-expanded", "false");
          details.setAttribute("hidden", "");
        }
      }

      function collapseOthers(activeCard) {
        cards.forEach(card => {
          if (card !== activeCard) {
            setExpanded(card, false);
          }
        });
      }

      cards.forEach(card => {
        card.addEventListener("click", event => {
          if (event.target.closest(".pub-links")) {
            return;
          }
          const isExpanded = card.getAttribute("aria-expanded") === "true";
          collapseOthers(card);
          setExpanded(card, !isExpanded);
        });

        card.addEventListener("keydown", event => {
          if (event.key !== "Enter" && event.key !== " ") {
            return;
          }
          event.preventDefault();
          const isExpanded = card.getAttribute("aria-expanded") === "true";
          collapseOthers(card);
          setExpanded(card, !isExpanded);
        });
      });
    }

    function fillProfile(person) {
      document.title = `${person.name} - H2RES Team`;
      document.getElementById("memberName").textContent = person.name;
      document.getElementById("memberRole").textContent = person.role;
      document.getElementById("memberOrg").textContent = person.institution;
      document.getElementById("memberBio").textContent = person.bio;
      const photo = document.getElementById("memberPhoto");
      photo.src = person.photo;
      photo.alt = person.name;

      const topicsBox = document.getElementById("topicsBox");
      topicsBox.innerHTML = person.topics
        .map(topic => `<span class="topic-chip">${escapeHtml(topic)}</span>`)
        .join("");
    }

    function matchesPerson(entry, person) {
      const foldedAuthors = foldText(entry.fields.author || "");
      if (!foldedAuthors) {
        return false;
      }
      return person.aliases.some(alias => {
        const foldedAlias = foldText(alias);
        return foldedAlias && foldedAuthors.includes(foldedAlias);
      });
    }

    function renderPublications(entries, person) {
      const root = document.getElementById("pubRoot");
      const matched = entries
        .filter(entry => matchesPerson(entry, person))
        .sort((a, b) => {
          if (b.sortYear !== a.sortYear) {
            return b.sortYear - a.sortYear;
          }
          return a.citationKey.localeCompare(b.citationKey);
        });
      if (matched.length === 0) {
        root.innerHTML = '<div class="empty-box">No matching publications were found for this member in H2RES.bib yet.</div>';
        return;
      }
      root.innerHTML = `
        <ul class="pub-list">
          ${matched.map(buildPublicationItem).join("")}
        </ul>
      `;
      bindBibtexButtons(matched);
      bindPublicationItemToggleActions();
    }

    function renderPublicationsWithTabs(entries, person) {
      const root = document.getElementById("pubRoot");
      const tabsRoot = document.getElementById("memberPubTabs");
      const matched = entries
        .filter(entry => matchesPerson(entry, person))
        .sort((a, b) => {
          if (b.sortYear !== a.sortYear) {
            return b.sortYear - a.sortYear;
          }
          return a.citationKey.localeCompare(b.citationKey);
        });

      if (matched.length === 0) {
        tabsRoot.innerHTML = "";
        root.innerHTML = '<div class="empty-box">No matching publications were found for this member in H2RES.bib yet.</div>';
        return;
      }

      const categoryOrder = ["articles", "conference", "report", "thesis", "project", "database"];
      const grouped = {
        articles: [],
        conference: [],
        report: [],
        thesis: [],
        project: [],
        database: []
      };

      matched.forEach(entry => {
        const category = entryCategory(entry);
        if (!grouped[category]) {
          grouped[category] = [];
        }
        grouped[category].push(entry);
      });

      const visibleCategories = categoryOrder.filter(category => (grouped[category] || []).length > 0);
      if (visibleCategories.length === 0) {
        tabsRoot.innerHTML = "";
        root.innerHTML = '<div class="empty-box">No categorized publications were found for this member.</div>';
        return;
      }

      function renderCategory(category) {
        const selectedEntries = grouped[category] || [];
        root.innerHTML = `
          <ul class="pub-list">
            ${selectedEntries.map(buildPublicationItem).join("")}
          </ul>
        `;
        bindBibtexButtons(selectedEntries);
        bindPublicationItemToggleActions();
      }
      tabsRoot.innerHTML = visibleCategories
        .map((category, index) => {
          const count = grouped[category].length;
          const activeClass = index === 0 ? " active" : "";
          return `<button type="button" class="member-pub-tab${activeClass}" data-category="${escapeHtml(category)}">${escapeHtml(categoryLabel(category))} (${count})</button>`;
        })
        .join("");

      const tabButtons = Array.from(tabsRoot.querySelectorAll(".member-pub-tab"));
      tabButtons.forEach(button => {
        button.addEventListener("click", () => {
          const category = button.getAttribute("data-category");
          tabButtons.forEach(btn => btn.classList.remove("active"));
          button.classList.add("active");
          renderCategory(category);
        });
      });

      renderCategory(visibleCategories[0]);
    }

    async function bootstrap() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const person = PEOPLE[id];

      if (!person) {
        document.getElementById("memberName").textContent = "Member not found";
        document.getElementById("memberRole").textContent = "";
        document.getElementById("memberOrg").textContent = "";
        document.getElementById("memberBio").textContent = "Use the Team page and open a valid member profile.";
        document.getElementById("pubRoot").innerHTML = '<div class="empty-box">No profile loaded.</div>';
        return;
      }

      fillProfile(person);

      try {
        const response = await fetch("../H2RES.bib", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const text = await response.text();
        const entries = parseBibTeX(text);
        renderPublicationsWithTabs(entries, person);
      } catch (error) {
        document.getElementById("pubRoot").innerHTML = '<div class="pub-status">Could not load H2RES.bib for this profile.</div>';
      }
    }

    function setupTheme() {
      const html = document.documentElement;
      const currentTheme = localStorage.getItem("theme") || "light";
      html.setAttribute("data-theme", currentTheme);

      const button = document.getElementById("themeToggleBtn");
      button.addEventListener("click", () => {
        const current = html.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      });
    }

    setupTheme();
    bootstrap();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H2RES Project</title>
  <style>
    :root[data-theme="dark"] {
      --bg-dark: #0a0a0f;
      --bg-darker: #050508;
      --bg-card: #111118;
      --bg-card-hover: #1a1a24;
      --text-primary: #ffffff;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --accent-teal: #14b8a6;
      --accent-green: #10b981;
      --border-color: #1f2937;
      --border-hover: #374151;
    }

    :root[data-theme="light"] {
      --bg-dark: #ffffff;
      --bg-darker: #f9fafb;
      --bg-card: #ffffff;
      --bg-card-hover: #f3f4f6;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --accent-teal: #0d9488;
      --accent-green: #059669;
      --border-color: #e5e7eb;
      --border-hover: #d1d5db;
    }

    :root {
      --max-width: 1040px;
      --radius: 12px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-darker);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    .topbar {
      padding: 22px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .site-logo {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .site-logo-image {
      height: 36px;
      width: auto;
      display: block;
    }

    .back-link {
      color: var(--accent-teal);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .theme-btn {
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-secondary);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .theme-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .theme-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      color: var(--text-muted);
    }

    .theme-btn-icon {
      position: relative;
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .theme-btn-icon svg {
      position: absolute;
      width: 16px;
      height: 16px;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .theme-btn-icon .sun-icon {
      opacity: 0;
      transform: rotate(-90deg);
    }

    .theme-btn-icon .moon-icon {
      opacity: 1;
      transform: rotate(0deg);
    }

    [data-theme="light"] .theme-btn-icon .sun-icon {
      opacity: 1;
      transform: rotate(0deg);
    }

    [data-theme="light"] .theme-btn-icon .moon-icon {
      opacity: 0;
      transform: rotate(90deg);
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px;
      margin-bottom: 24px;
    }

    .project-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(20, 184, 166, 0.12);
      color: var(--accent-teal);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .project-title {
      font-size: 30px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .project-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .project-meta-item {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 8px;
      text-align: left;
      width: 100%;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .project-meta-label {
      min-width: 88px;
      color: var(--text-primary);
      font-weight: 600;
    }

    .project-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }

    .project-links a,
    .project-links button {
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      text-decoration: none;
      color: var(--accent-teal);
      font-size: 13px;
      font-weight: 500;
    }

    .project-links a:hover,
    .project-links button:hover {
      text-decoration: underline;
    }

    .section-title {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .section-block + .section-block {
      margin-top: 18px;
    }

    .section-text {
      color: var(--text-secondary);
      font-size: 15px;
    }

    .keywords {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .keyword-chip {
      border: 1px solid var(--border-color);
      background: var(--bg-card-hover);
      color: var(--text-secondary);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
    }

    .funding-block {
      margin-top: 20px;
    }

    .funding-card {
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      background: #ffffff;
      padding: 14px;
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 14px;
      align-items: center;
    }

    .funding-logo {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      background: #ffffff;
    }

    .funding-logo-anid {
      width: 74%;
      margin: 0 auto;
    }

    .funding-kicker {
      font-size: 12px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--accent-teal);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .funding-text {
      color: #374151;
      font-size: 14px;
    }

    .status-box {
      border: 1px dashed var(--border-color);
      border-radius: var(--radius);
      padding: 14px;
      color: var(--text-secondary);
      background: var(--bg-card-hover);
      font-size: 14px;
    }

    @media (max-width: 760px) {
      .project-title {
        font-size: 24px;
      }

      .funding-card {
        grid-template-columns: 1fr;
      }

      .funding-logo {
        max-width: 260px;
      }

      .funding-logo-anid {
        max-width: 180px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="topbar-left">
        <a class="site-logo" href="../index.html#home" aria-label="H2RES Home">
          <img src="../assets/h2res-logo.png" alt="H2RES" class="site-logo-image">
        </a>
        <a class="back-link" href="../index.html#publications">&larr; Back to Publications</a>
      </div>
      <button class="theme-btn" id="themeToggleBtn" type="button" disabled title="Theme toggle temporarily disabled" aria-label="Theme toggle disabled">
        <span class="theme-btn-icon" aria-hidden="true">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
      </button>
    </div>

    <section class="project-card" id="projectRoot">
      <div class="status-box">Loading project from <code>H2RES.bib</code>...</div>
    </section>
  </div>

  <script>
    const BIB_SOURCE = '../H2RES.bib';
    const PROJECT_EXTRA = {};

    function escapeHtml(text) {
      return String(text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function normalizeBibValue(value) {
      return (value || '')
        .replace(/\r\n?/g, '\n')
        .replace(/\\&/g, '&')
        .replace(/\\%/g, '%')
        .replace(/\\_/g, '_')
        .replace(/[{}]/g, '')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function findTopLevelComma(text) {
      let depth = 0;
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const prev = i > 0 ? text[i - 1] : '';
        if (char === '"' && prev !== '\\') {
          inQuotes = !inQuotes;
          continue;
        }
        if (inQuotes) {
          continue;
        }
        if (char === '{') {
          depth++;
        } else if (char === '}') {
          depth = Math.max(0, depth - 1);
        } else if (char === ',' && depth === 0) {
          return i;
        }
      }
      return -1;
    }

    function readBibValue(text, startIndex) {
      let index = startIndex;
      while (index < text.length && /\s/.test(text[index])) {
        index++;
      }

      const first = text[index];
      if (!first) {
        return { value: '', nextIndex: index };
      }

      if (first === '{') {
        let depth = 1;
        let i = index + 1;
        let inQuotes = false;
        while (i < text.length && depth > 0) {
          const char = text[i];
          const prev = i > 0 ? text[i - 1] : '';
          if (char === '"' && prev !== '\\') {
            inQuotes = !inQuotes;
          }
          if (!inQuotes) {
            if (char === '{') {
              depth++;
            } else if (char === '}') {
              depth--;
            }
          }
          i++;
        }
        return {
          value: text.slice(index + 1, Math.max(index + 1, i - 1)),
          nextIndex: i
        };
      }

      if (first === '"') {
        let i = index + 1;
        while (i < text.length) {
          if (text[i] === '"' && text[i - 1] !== '\\') {
            break;
          }
          i++;
        }
        return {
          value: text.slice(index + 1, i),
          nextIndex: Math.min(i + 1, text.length)
        };
      }

      let i = index;
      while (i < text.length && text[i] !== ',') {
        i++;
      }
      return {
        value: text.slice(index, i).trim(),
        nextIndex: i
      };
    }

    function parseBibFields(fieldsText) {
      const fields = {};
      let index = 0;

      while (index < fieldsText.length) {
        while (index < fieldsText.length && /[\s,]/.test(fieldsText[index])) {
          index++;
        }
        if (index >= fieldsText.length) {
          break;
        }

        const fieldStart = index;
        while (index < fieldsText.length && /[a-zA-Z0-9_-]/.test(fieldsText[index])) {
          index++;
        }
        const fieldName = fieldsText.slice(fieldStart, index).toLowerCase();
        while (index < fieldsText.length && /\s/.test(fieldsText[index])) {
          index++;
        }
        if (fieldsText[index] !== '=') {
          const nextComma = findTopLevelComma(fieldsText.slice(index));
          if (nextComma === -1) {
            break;
          }
          index += nextComma + 1;
          continue;
        }
        index++;

        const parsedValue = readBibValue(fieldsText, index);
        fields[fieldName] = normalizeBibValue(parsedValue.value);
        index = parsedValue.nextIndex;
      }

      return fields;
    }

    function parseBibTeX(text) {
      const cleanText = (text || '')
        .replace(/\r\n?/g, '\n')
        .replace(/^\s*%.*$/gm, '');

      const entries = [];
      let index = 0;

      while (index < cleanText.length) {
        const atIndex = cleanText.indexOf('@', index);
        if (atIndex === -1) {
          break;
        }

        const headerMatch = cleanText.slice(atIndex + 1).match(/^([A-Za-z]+)\s*([{(])/);
        if (!headerMatch) {
          index = atIndex + 1;
          continue;
        }

        const entryType = headerMatch[1].toLowerCase();
        const openChar = headerMatch[2];
        const closeChar = openChar === '{' ? '}' : ')';
        const openIndex = atIndex + 1 + headerMatch[0].length - 1;
        let i = openIndex + 1;
        let depth = 1;
        let inQuotes = false;

        while (i < cleanText.length && depth > 0) {
          const char = cleanText[i];
          const prev = i > 0 ? cleanText[i - 1] : '';
          if (char === '"' && prev !== '\\') {
            inQuotes = !inQuotes;
          } else if (!inQuotes) {
            if (char === openChar) {
              depth++;
            } else if (char === closeChar) {
              depth--;
            }
          }
          i++;
        }

        if (depth !== 0) {
          break;
        }

        const rawBody = cleanText.slice(openIndex + 1, i - 1).trim();
        const commaIndex = findTopLevelComma(rawBody);
        if (commaIndex === -1) {
          index = i;
          continue;
        }

        const citationKey = rawBody.slice(0, commaIndex).trim();
        const fieldsText = rawBody.slice(commaIndex + 1).trim();
        const fields = parseBibFields(fieldsText);

        entries.push({
          entryType,
          citationKey,
          fields,
          bibtex: cleanText.slice(atIndex, i).trim()
        });

        index = i;
      }

      return entries;
    }

    function isResearchProjectEntry(entry) {
      const entryType = (entry.entryType || '').toLowerCase();
      const howPublished = normalizeBibValue(entry.fields.howpublished || '').toLowerCase();
      return entryType === 'misc' && howPublished === 'research project';
    }

    function formatAuthors(authorsValue) {
      const authors = (authorsValue || '')
        .split(/\s+and\s+/i)
        .map(part => normalizeBibValue(part))
        .filter(Boolean);
      return authors.join(', ');
    }

    function extractFundingInfo(noteText, institutionText = '') {
      const normalized = normalizeBibValue(noteText || '');
      const normalizedInstitution = normalizeBibValue(institutionText || '');
      const searchable = `${normalized} ${normalizedInstitution}`.trim();
      if (!searchable) {
        return null;
      }

      if (/croatian science foundation/i.test(searchable)) {
        const projectNoMatch = normalized.match(/project no\.\s*([A-Za-z0-9-]+)/i);
        return {
          agency: 'Croatian Science Foundation',
          projectNo: projectNoMatch ? projectNoMatch[1] : '',
          logo: '../assets/funders/hrzz.jpg',
          logoAlt: 'HRZZ - Croatian Science Foundation',
          text: `Funded by the Croatian Science Foundation${projectNoMatch ? `, project no. ${projectNoMatch[1]}` : ''}.`
        };
      }

      if (/interreg danube region/i.test(searchable)) {
        return {
          agency: 'Interreg Danube Region',
          projectNo: '',
          logo: '../assets/funders/storemore.png',
          logoAlt: 'Interreg Danube Region - Co-funded by the European Union - StoreMore',
          text: 'Funded by the Interreg Danube Region.'
        };
      }

      const isAnidChile = /agencia nacional de investigaci/i.test(searchable)
        && /desarrollo\s*\(chile\)/i.test(searchable);
      if (isAnidChile) {
        const codeMatch = normalized.match(/(?:cod|code)\s*:\s*([^.,;]+)/i);
        const fundingCode = codeMatch ? codeMatch[1].trim() : '';
        return {
          agency: 'Agencia Nacional de Investigaci\u00f3n y Desarrollo (Chile)',
          projectNo: fundingCode,
          logo: '../assets/funders/anid.png',
          logoClass: 'funding-logo-anid',
          logoAlt: 'Agencia Nacional de Investigaci\u00f3n y Desarrollo (Chile)',
          text: `Funded by the Agencia Nacional de Investigaci\u00f3n y Desarrollo (Chile)${fundingCode ? `, code: ${fundingCode}` : ''}.`
        };
      }

      return null;
    }

    function buildLinks(entry) {
      const links = [];
      const doiRaw = (entry.fields.doi || '').replace(/^doi:\s*/i, '').trim();
      const doiUrl = doiRaw.startsWith('http') ? doiRaw : (doiRaw ? `https://doi.org/${doiRaw}` : '');
      const url = entry.fields.url || '';
      const pdf = entry.fields.pdf || '';

      if (doiUrl) {
        links.push(`<a href="${escapeHtml(doiUrl)}" target="_blank" rel="noopener noreferrer">DOI &#8599;</a>`);
      }
      if (url) {
        links.push(`<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">URL &#8599;</a>`);
      }
      if (pdf) {
        links.push(`<a href="${escapeHtml(pdf)}" target="_blank" rel="noopener noreferrer">PDF &#8599;</a>`);
      }
      links.push('<button type="button" id="copyBibtexBtn">Copy BibTeX</button>');

      return links.join('');
    }

    function renderProject(entry) {
      const root = document.getElementById('projectRoot');
      const title = normalizeBibValue(entry.fields.title || entry.citationKey || 'Untitled project');
      const year = normalizeBibValue(entry.fields.year || 'n.d.');
      const authors = normalizeBibValue(formatAuthors(entry.fields.author || '')) || 'Not specified';
      const institution = normalizeBibValue(entry.fields.institution || entry.fields.organization || entry.fields.publisher || 'Not specified');
      const note = normalizeBibValue(entry.fields.note || '');
      const fundingInfo = extractFundingInfo(note, institution);
      const abstractText = normalizeBibValue(entry.fields.abstract || '');
      const keywords = normalizeBibValue(entry.fields.keywords || '')
        .split(/[;,]/)
        .map(item => item.trim())
        .filter(Boolean);
      const extra = PROJECT_EXTRA[entry.citationKey] || null;
      const strictMatch = isResearchProjectEntry(entry);
      const displayNote = note && !fundingInfo;

      document.title = `${title} - H2RES Project`;

      root.innerHTML = `
        <div class="project-badge">${strictMatch ? 'Research Project' : 'Project Record'}</div>
        <h1 class="project-title">${escapeHtml(title)}</h1>
        <div class="project-meta">
          <div class="project-meta-item"><span class="project-meta-label">Authors:</span><span>${escapeHtml(authors)}</span></div>
          <div class="project-meta-item"><span class="project-meta-label">Institution:</span><span>${escapeHtml(institution)}</span></div>
          <div class="project-meta-item"><span class="project-meta-label">Year:</span><span>${escapeHtml(year)}</span></div>
        </div>
        <div class="project-links">${buildLinks(entry)}</div>
        ${displayNote ? `<p class="section-text"><strong>Note:</strong> ${escapeHtml(note)}</p>` : ''}
        <div class="section-block">
          <h2 class="section-title">Overview</h2>
          <p class="section-text">${escapeHtml(abstractText || 'No abstract available in this BibTeX entry yet.')}</p>
        </div>
        <div class="section-block">
          <h2 class="section-title">Keywords</h2>
          ${keywords.length > 0 ? `<div class="keywords">${keywords.map(tag => `<span class="keyword-chip">${escapeHtml(tag)}</span>`).join('')}</div>` : '<p class="section-text">No keywords available in this BibTeX entry yet.</p>'}
        </div>
        <div class="section-block">
          <h2 class="section-title">Extended Project Information</h2>
          <p class="section-text">${escapeHtml((extra && extra.description) || 'Add project objectives, partners, milestones, datasets, and outputs here.')}</p>
        </div>
        ${fundingInfo ? `
          <div class="section-block funding-block">
            <div class="funding-card">
              <img src="${escapeHtml(fundingInfo.logo || '')}" alt="${escapeHtml(fundingInfo.logoAlt || 'Funding logo')}" class="funding-logo${fundingInfo.logoClass ? ` ${escapeHtml(fundingInfo.logoClass)}` : ''}">
              <div>
                <p class="funding-kicker">Funding Support</p>
                <p class="funding-text">${escapeHtml(fundingInfo.text || '')}</p>
              </div>
            </div>
          </div>
        ` : ''}
      `;

      const copyButton = document.getElementById('copyBibtexBtn');
      if (copyButton) {
        copyButton.addEventListener('click', async () => {
          const original = copyButton.textContent;
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(entry.bibtex || '');
            } else {
              const helper = document.createElement('textarea');
              helper.value = entry.bibtex || '';
              helper.setAttribute('readonly', '');
              helper.style.position = 'fixed';
              helper.style.left = '-9999px';
              document.body.appendChild(helper);
              helper.select();
              document.execCommand('copy');
              document.body.removeChild(helper);
            }
            copyButton.textContent = 'Copied';
          } catch (error) {
            copyButton.textContent = 'Copy failed';
          }
          window.setTimeout(() => {
            copyButton.textContent = original;
          }, 1200);
        });
      }
    }

    async function bootstrap() {
      const root = document.getElementById('projectRoot');
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        root.innerHTML = '<div class="status-box">No project id was provided.</div>';
        return;
      }

      try {
        const response = await fetch(BIB_SOURCE, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const text = await response.text();
        const entries = parseBibTeX(text);
        const entry = entries.find(item => item.citationKey === id);
        if (!entry) {
          root.innerHTML = '<div class="status-box">Project not found in <code>H2RES.bib</code>.</div>';
          return;
        }
        renderProject(entry);
      } catch (error) {
        const protocolHint = window.location.protocol === 'file:'
          ? ' Open this page through a local web server to load local files.'
          : '';
        root.innerHTML = `<div class="status-box">Could not load <code>${escapeHtml(BIB_SOURCE)}</code>.${protocolHint}</div>`;
      }
    }

    function setupTheme() {
      const html = document.documentElement;
      const THEME_TOGGLE_ENABLED = false;
      html.setAttribute('data-theme', 'light');
      localStorage.setItem('theme', 'light');

      const button = document.getElementById('themeToggleBtn');
      if (!button) {
        return;
      }
      button.disabled = !THEME_TOGGLE_ENABLED;
      if (!THEME_TOGGLE_ENABLED) {
        return;
      }

      button.addEventListener('click', () => {
        const current = html.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    }

    setupTheme();
    bootstrap();
  </script>
</body>
</html>
